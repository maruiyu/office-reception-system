<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>応答画面 - オフィス受付 (社内スタッフ用)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden;
        }

        .video-blur {
            backdrop-filter: blur(15px);
        }

        .unlock-btn {
            background: linear-gradient(135deg, #1e40af 0%, #1a365d 100%);
        }

        .answer-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .animate-pulse-subtle {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .ring-animation {
            animation: ring 1.5s infinite;
        }

        @keyframes ring {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col items-center justify-center">

    <!-- Developer Hint (Badge) -->
    <div
        class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-yellow-400 text-black px-4 py-1 rounded-full text-xs font-bold shadow-lg">
        社内スタッフ端末：応答・解錠画面
    </div>

    <!-- Video Area (Placeholder) -->
    <div class="absolute inset-0 z-0">
        <div id="video-bg"
            class="w-full h-full bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center transition-all duration-1000 grayscale opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-64 w-64 text-gray-700" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                    d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p id="video-status"
                class="absolute bottom-1/2 translate-y-24 text-gray-400 text-xl font-medium tracking-widest">CALLING...
            </p>
        </div>
    </div>

    <!-- Interface Overlay -->
    <div class="relative z-10 w-full h-screen flex flex-col justify-between p-12">

        <!-- Top: Connection Status -->
        <div class="flex justify-between items-start">
            <div id="call-status-badge"
                class="bg-black/50 video-blur border border-white/20 rounded-full px-6 py-3 flex items-center space-x-3 shadow-xl">
                <div class="w-2.5 h-2.5 bg-yellow-500 rounded-full animate-pulse"></div>
                <span id="call-status-text" class="text-white font-bold tracking-widest text-sm uppercase">Waiting for
                    response...</span>
            </div>
            <button onclick="location.href='reception-home.html'"
                class="bg-gray-800/80 hover:bg-gray-700 text-white p-4 rounded-full transition-all shadow-xl group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 group-hover:scale-110 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Middle: Visitor Info Overlay -->
        <div class="mb-12">
            <div class="bg-black/40 video-blur border-l-8 border-blue-500 p-8 rounded-r-3xl inline-block max-w-2xl shadow-2xl backdrop-opacity-90 transition-all"
                id="info-card">
                <h2 class="text-sm text-blue-400 font-bold tracking-widest uppercase mb-2">エントランス着信</h2>
                <div class="text-white">
                    <p class="text-5xl font-black mb-1">来訪者があります</p>
                    <p id="sub-text" class="text-xl text-gray-400 mt-2">呼び出し音が鳴っています...</p>
                </div>
            </div>
        </div>

        <!-- Bottom: Call Controls -->
        <div class="pb-12 h-48 flex items-center justify-center">

            <!-- INITIAL STATE: Answer Button -->
            <div id="incoming-actions" class="flex flex-col items-center space-y-6">
                <button onclick="startCall()" class="group">
                    <div class="flex flex-col items-center space-y-4">
                        <div
                            class="w-32 h-32 answer-btn rounded-full flex items-center justify-center shadow-2xl group-hover:brightness-110 group-active:scale-95 transition-all ring-animation">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </div>
                        <span class="text-white font-bold text-3xl drop-shadow-lg tracking-widest animate-pulse">応
                            答</span>
                    </div>
                </button>
                <div class="flex items-center space-x-8">
                    <button onclick="location.href='reception-home.html'"
                        class="text-gray-400 hover:text-white font-bold tracking-widest px-6 py-2 border border-gray-600 rounded-full hover:bg-gray-800 transition-all">拒否する</button>
                    <button
                        class="text-gray-400 hover:text-white font-bold tracking-widest px-6 py-2 border border-gray-600 rounded-full hover:bg-gray-800 transition-all">保留</button>
                </div>
            </div>

            <!-- ACTIVE STATE: In-call Actions (Hidden initially) -->
            <div id="active-call-actions" class="hidden flex justify-center items-center space-x-12">
                <!-- End Call Button -->
                <button onclick="location.href='reception-home.html'" class="group">
                    <div class="flex flex-col items-center space-y-4">
                        <div
                            class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center shadow-2xl group-hover:bg-red-700 group-active:scale-90 transition-all border-4 border-white/10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white transform rotate-135"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z" />
                            </svg>
                        </div>
                        <span class="text-white font-bold text-lg drop-shadow-lg tracking-wider">拒否 / 終了</span>
                    </div>
                </button>

                <!-- Unlock Button -->
                <button onclick="showUnlockSuccess()" class="group">
                    <div class="flex flex-col items-center space-y-4">
                        <div
                            class="w-32 h-32 unlock-btn rounded-full flex items-center justify-center shadow-2xl group-hover:brightness-125 group-active:scale-95 transition-all outline outline-offset-8 outline-white/20 border-4 border-white/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span class="text-white font-bold text-2xl drop-shadow-lg tracking-widest mt-2"> 解 錠 </span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Success Overlay (Hidden) -->
    <div id="success-overlay"
        class="hidden fixed inset-0 z-50 bg-[#1a365d]/90 flex flex-col items-center justify-center text-white">
        <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center mb-8 animate-bounce">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-[#1a365d]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-5xl font-bold mb-4 tracking-tighter">解錠完了</h1>
        <p class="text-2xl text-blue-200">電気錠をオープンしました</p>
        <button onclick="location.href='reception-home.html'"
            class="mt-12 px-10 py-4 border-2 border-white rounded-full text-xl hover:bg-white hover:text-[#1a365d] transition-all font-bold">
            メイン画面に戻る
        </button>
    </div>

    <script>
        function startCall() {
            // UI state change
            document.getElementById('incoming-actions').classList.add('hidden');
            document.getElementById('active-call-actions').classList.remove('hidden');

            // Background visual change
            const bg = document.getElementById('video-bg');
            bg.classList.remove('grayscale', 'opacity-50');
            bg.classList.add('opacity-100');

            // Badge/Status update
            const badge = document.getElementById('call-status-badge');
            badge.children[0].classList.remove('bg-yellow-500');
            badge.children[0].classList.add('bg-red-500');
            document.getElementById('call-status-text').textContent = 'REC / 00:01';

            // Message update
            document.getElementById('video-status').textContent = 'VISITOR STREAMING...';
            document.getElementById('sub-text').textContent = 'ビデオ通話が繋がっています';
        }

        function showUnlockSuccess() {
            document.getElementById('success-overlay').classList.remove('hidden');
        }
    </script>
</body>

</html>
